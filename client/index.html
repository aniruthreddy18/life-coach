<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Your personal career coach: a plan, daily tasks, evening check-ins and honest weekly reports." />
    <meta name="theme-color" content="#f6f9fc" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- iPhone: open full-screen (no Safari bars) when started from the Home Screen -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Coach" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Life Coach</title>
    <script>
      // Apply the saved theme BEFORE the page paints, so there's no flash.
      // Default is light (navy + white); "system" follows the device.
      var t = "light";
      try { t = localStorage.getItem("theme") || "light"; } catch (e) {}
      if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
    </script>
  </head>
  <body>
    <!-- React draws the whole app inside this div -->
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
